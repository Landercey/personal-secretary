<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>私人秘书</title>
<style>
/* =====================================================================
   设计取向：克制，不是花哨
   留白和层次感来自「间距 + 字重对比 + 极轻的阴影」，
   不来自渐变、不来自大圆角、不来自动画特效。
   配色只用一个强调色（靛蓝），其余全是中性灰。
   ===================================================================== */
:root {
  --bg:        #f6f6f7;
  --panel:     #ffffff;
  --line:      #ececee;
  --text:      #1c1c1e;
  --text-2:    #6b6b70;
  --text-3:    #9a9aa0;
  --accent:    #4f46e5;
  --accent-bg: #eef0fe;
  --overdue:   #dc2626;
  --today:     #ea580c;
  --soon:      #2563eb;
  --radius:    10px;
  /* 阴影只用一层、极轻。叠两层就开始像模板了 */
  --shadow:    0 1px 2px rgba(16,16,20,.05), 0 1px 8px rgba(16,16,20,.04);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

.app { display: flex; height: 100%; }

/* ---------- 左侧：智能列表 ---------- */
aside {
  width: 208px; flex: none; padding: 18px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.brand {
  font-size: 15px; font-weight: 600; letter-spacing: .3px;
  padding: 0 10px 18px; color: var(--text);
}
.brand small { display:block; font-weight:400; font-size:11px; color:var(--text-3); margin-top:3px; letter-spacing:0 }
nav a {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 7px; cursor: default;
  color: var(--text-2); font-size: 13.5px;
  transition: background .12s ease, color .12s ease;
}
nav a:hover { background: rgba(0,0,0,.035); }
nav a.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
nav a .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; flex:none }
nav a .n { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums }
nav a.on .n { color: var(--accent); opacity: .75 }
nav .gap { height: 14px }
.foot { margin-top: auto; padding: 10px; font-size: 11px; line-height: 1.7; color: var(--text-3) }

/* ---------- 中间：列表 ---------- */
main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 22px 20px 0 8px }
.head { display: flex; align-items: baseline; gap: 12px; padding: 0 4px 14px }
.head h1 { font-size: 21px; font-weight: 600; margin: 0; letter-spacing: .2px }
.head .sub { font-size: 12.5px; color: var(--text-3) }

.list { flex: 1; overflow-y: auto; padding: 2px 4px 24px; }
.list::-webkit-scrollbar { width: 9px }
.list::-webkit-scrollbar-thumb { background: rgba(0,0,0,.13); border-radius: 99px; border: 3px solid transparent; background-clip: content-box }
.list::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.24); background-clip: content-box }

/* 卡片：一条待办 */
.row {
  display: flex; align-items: flex-start; gap: 11px;
  background: var(--panel); border-radius: var(--radius);
  padding: 13px 15px; margin-bottom: 7px; box-shadow: var(--shadow);
  cursor: default; transition: transform .1s ease, box-shadow .12s ease;
}
.row:hover { box-shadow: 0 2px 4px rgba(16,16,20,.06), 0 2px 12px rgba(16,16,20,.05) }
.row.sel { box-shadow: 0 0 0 1.5px var(--accent), 0 2px 10px rgba(79,70,229,.14) }

.tick {
  width: 17px; height: 17px; flex: none; margin-top: 1.5px;
  border: 1.6px solid #cfcfd4; border-radius: 50%;
  cursor: pointer; transition: border-color .12s, background .12s;
}
.tick:hover { border-color: var(--accent); background: var(--accent-bg) }

.body { flex: 1; min-width: 0 }
.title { font-size: 14px; line-height: 1.45; word-break: break-word }
.meta { margin-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3) }
.meta .due { font-variant-numeric: tabular-nums }
.meta .due.overdue { color: var(--overdue); font-weight: 600 }
.meta .due.today   { color: var(--today);  font-weight: 600 }
.meta .due.soon    { color: var(--soon) }
.meta .sep { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .5 }
.meta .clip { opacity: .8 }

.empty { text-align: center; color: var(--text-3); padding: 60px 20px; font-size: 13px; line-height: 2 }

/* ---------- 右侧：详情 ---------- */
.detail {
  width: 0; flex: none; overflow: hidden; background: var(--panel);
  border-left: 1px solid transparent;
  transition: width .2s cubic-bezier(.4,0,.2,1), border-color .2s;
}
.detail.open { width: 320px; border-left-color: var(--line) }
.detail .inner { width: 320px; padding: 22px 20px; height: 100%; overflow-y: auto }
.detail h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; line-height: 1.5; word-break: break-word }
.kv { display: flex; gap: 10px; font-size: 12.5px; line-height: 1.8; padding: 6px 0; border-bottom: 1px solid var(--line) }
.kv:last-of-type { border-bottom: 0 }
.kv b { flex: none; width: 52px; color: var(--text-3); font-weight: 400 }
.kv span { color: var(--text-2); word-break: break-word }
.quote {
  margin-top: 14px; padding: 11px 12px; border-radius: 8px; background: #fafafa;
  font-size: 12.5px; line-height: 1.75; color: var(--text-2); white-space: pre-wrap; word-break: break-word
}
.quote em { display: block; font-style: normal; font-size: 11px; color: var(--text-3); margin-bottom: 5px }
.acts { margin-top: 18px; display: flex; gap: 8px }
button {
  font: inherit; font-size: 12.5px; padding: 7px 13px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--panel); color: var(--text-2);
  cursor: pointer; transition: background .12s, border-color .12s, color .12s
}
button:hover { background: #fafafa; border-color: #dedee2 }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff }
button.primary:hover { background: #4338ca }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
  background: rgba(28,28,30,.92); color: #fff; font-size: 12.5px;
  padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0) }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">私人秘书<small>群消息 → 待办 → 手机</small></div>
    <nav id="nav"></nav>
    <div class="foot" id="foot">正在连接…</div>
  </aside>

  <main>
    <div class="head"><h1 id="viewTitle">今天</h1><span class="sub" id="viewSub"></span></div>
    <div class="list" id="list"></div>
  </main>

  <section class="detail" id="detail">
    <div class="inner" id="detailInner"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   和 Python 的桥：window.pywebview.api.xxx()
   只有确认桥接好了才能调，所以全部逻辑挂在 pywebviewready 之后。
   ===================================================================== */
const VIEWS = [
  { id: 'today',    label: '今天' },
  { id: 'tomorrow', label: '明天' },
  { id: 'week',     label: '本周' },
  { id: 'overdue',  label: '逾期' },
  { gap: true },
  { id: 'open',     label: '全部未完成' },
  { id: 'archive',  label: '已归档' },
  { id: 'junk',     label: '废件箱' },
];

let current = 'today';
let items = [];
let selected = null;
let counts = {};

const $ = (id) => document.getElementById(id);

function api() { return window.pywebview.api; }

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

/* ---------- 左侧导航 ---------- */
function renderNav() {
  $('nav').innerHTML = VIEWS.map(v => {
    if (v.gap) return '<div class="gap"></div>';
    const n = counts[v.id] || 0;
    return `<a data-view="${v.id}" class="${v.id === current ? 'on' : ''}">
      <i class="dot"></i><span>${v.label}</span>${n ? `<i class="n">${n}</i>` : ''}</a>`;
  }).join('');
  $('nav').querySelectorAll('a').forEach(a => {
    a.onclick = () => { current = a.dataset.view; selected = null; refresh(); };
  });
}

/* ---------- 中间列表 ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderList() {
  const box = $('list');
  if (!items.length) {
    box.innerHTML = `<div class="empty">这里没有待办<br>
      <span style="font-size:12px">群消息里的通知会自动出现在这里</span></div>`;
    return;
  }
  box.innerHTML = items.map(t => `
    <div class="row ${t.id === selected ? 'sel' : ''}" data-id="${t.id}">
      <i class="tick" data-done="${t.id}" title="标记完成"></i>
      <div class="body">
        <div class="title">${esc(t.title)}</div>
        <div class="meta">
          <span class="due ${t.urgency}">${esc(t.due)}</span>
          ${t.location ? `<i class="sep"></i><span>${esc(t.location)}</span>` : ''}
          ${t.source ? `<i class="sep"></i><span>${esc(t.source)}</span>` : ''}
          ${t.attachments ? `<span class="clip">📎${t.attachments}</span>` : ''}
        </div>
      </div>
    </div>`).join('');

  box.querySelectorAll('.row').forEach(row => {
    row.onclick = (e) => {
      if (e.target.dataset.done) return;
      selected = Number(row.dataset.id);
      renderList(); renderDetail();
    };
  });
  box.querySelectorAll('.tick').forEach(tick => {
    tick.onclick = async (e) => {
      e.stopPropagation();
      await api().complete(Number(tick.dataset.done));
      toast('已完成');
      refresh();
    };
  });
}

/* ---------- 右侧详情 ---------- */
function renderDetail() {
  const box = $('detail');
  const t = items.find(x => x.id === selected);
  if (!t) { box.classList.remove('open'); return; }
  box.classList.add('open');
  $('detailInner').innerHTML = `
    <h2>${esc(t.title)}</h2>
    <div class="kv"><b>时间</b><span class="due ${t.urgency}" style="color:inherit">${esc(t.due)}</span></div>
    ${t.location ? `<div class="kv"><b>地点</b><span>${esc(t.location)}</span></div>` : ''}
    ${t.source ? `<div class="kv"><b>来源</b><span>${esc(t.source)}${t.sender ? ' · ' + esc(t.sender) : ''}</span></div>` : ''}
    ${t.attachments ? `<div class="kv"><b>附件</b><span>${t.attachments} 个</span></div>` : ''}
    ${t.quoted ? `<div class="quote"><em>原始消息（判错了你能看出为什么）</em>${esc(t.quoted)}</div>` : ''}
    ${t.detail ? `<div class="quote">${esc(t.detail).slice(0, 800)}</div>` : ''}
    <div class="acts">
      <button class="primary" onclick="act('complete')">标记完成</button>
      <button onclick="act('archive')">归档</button>
      <button onclick="act('drop')">这不是待办</button>
    </div>`;
}

async function act(kind) {
  if (!selected) return;
  await api()[kind](selected);
  toast({ complete: '已完成', archive: '已归档', drop: '已记为误判' }[kind]);
  selected = null;
  refresh();
}

/* ---------- 统一刷新 ---------- */
async function refresh() {
  const view = current === 'junk' ? null : current;
  if (view) {
    const res = await api().tasks(view);
    items = res.items || [];
  } else {
    const res = await api().dropped();
    items = (res.items || []).map(d => ({
      id: 'junk-' + d.drop_id, title: d.text, due: d.reason,
      urgency: 'later', location: '', source: d.source_name || '',
      sender: '', quoted: '', detail: '', attachments: 0, junk: true,
    }));
  }
  counts = await api().counts();

  const meta = VIEWS.find(v => v.id === current) || {};
  $('viewTitle').textContent = meta.label || '今天';
  $('viewSub').textContent = items.length ? `${items.length} 条` : '';
  renderNav();
  renderList();
  renderDetail();

  const env = await api().config_summary();
  $('foot').textContent = env.push_times?.length
    ? `推送 ${env.push_times.join(' / ')}\n${env.qq_groups} 个群`
    : '还没配置推送';
}

window.addEventListener('pywebviewready', () => {
  refresh();
  // 后台收了新消息时自动刷新：定时重取，比做推送通道简单得多
  setInterval(refresh, 5000);
});
</script>
</body>
</html>
